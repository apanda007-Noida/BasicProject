name: Ingestion Scheduler & test Suite

on:
  schedule:
    # 04:30 AM UTC corresponds to 10:00 AM IST
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual run trigger from GitHub Actions web portal

jobs:
  scrape-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Ingestion
      run: |
        python src/ingestion/scraper.py
        python src/rag/indexer.py

    - name: Verify Ingested Data Quality
      run: |
        python tests/verify_ingestion.py

    - name: Run Unit Test Suite
      # Mock key variables to run tests successfully on GitHub (since secret API keys won't be set by default)
      env:
        GEMINI_API_KEY: ""
        GROQ_API_KEY: ""
      run: |
        python -m unittest discover tests
